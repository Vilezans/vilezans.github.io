<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Addons Minecraft</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            min-height: 100vh;
        }

     
        .sidebar {
            width: 220px;
            background-color: #111111;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 2px solid #2a2a2a;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 10;
        }

        .sidebar .logo-side img {
            max-width: 120px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .sidebar nav {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sidebar nav a {
            color: #aaaaaa;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .sidebar nav a:hover {
            background-color: #2a2a2a;
            color: #ffffff;
        }

        .sidebar nav a.ativo {
            background-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }


        .lang-toggle {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .lang-toggle button {
            background: #2a2a2a;
            border: 2px solid #444;
            color: #aaa;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-toggle button.ativo-idioma {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .lang-toggle button:hover {
            background: #444;
            color: #fff;
        }


        .main-content {
            margin-left: 220px;
            padding: 30px 40px 20px 40px;
            width: calc(100% - 220px);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }


        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page.ativa {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        #home .logo-principal {
            text-align: center;
            margin-bottom: 20px;
        }

        #home .logo-principal img {
            max-width: 180px;
            height: auto;
        }

        .search-area {
            display: flex;
            justify-content: center;
            margin: 20px 0 30px 0;
        }

        .search-area input {
            width: 100%;
            max-width: 500px;
            padding: 14px 24px;
            border-radius: 50px;
            border: 2px solid #333;
            background-color: #222;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .search-area input::placeholder {
            color: #777;
        }

        /* Grade de Banners */
        .banner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 10px;
        }

        .banner-item {
            background-color: #222;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #2a2a2a;
        }

        .banner-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            border-color: #3b82f6;
        }

        .banner-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .banner-item .info {
            padding: 16px 18px 18px 18px;
        }

        .banner-item .info h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #fff;
        }

        .banner-item .info p {
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
        }


        #projetos .header-projetos {
            text-align: center;
            margin-bottom: 30px;
        }

        #projetos .header-projetos h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        #projetos .header-projetos p {
            color: #888;
            font-size: 18px;
            margin-top: 5px;
        }

        .projetos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .card-projeto {
            background-color: #1e1e1e;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            transition: 0.3s;
            position: relative;
        }

        .card-projeto:hover {
            transform: scale(1.02);
            border-color: #3b82f6;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        /* Selo "Parceiro" / "Verificado" (estilo Minecraft) */
        .card-projeto .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #3b82f6;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
            border: 1px solid #6ba3ff;
        }

        .card-projeto img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-projeto .conteudo {
            padding: 20px 22px 25px 22px;
        }

        .card-projeto .conteudo h3 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #fff;
        }

        .card-projeto .conteudo .subtitulo {
            color: #3b82f6;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-projeto .conteudo p {
            color: #aaa;
            font-size: 15px;
            line-height: 1.6;
        }

    
        .footer {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            color: #888;
            font-size: 14px;
        }

        .footer .contatos {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer .contatos a {
            color: #aaa;
            text-decoration: none;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .footer .contatos a:hover {
            color: #fff;
        }

        .footer .discord-link {
            background: #5865F2;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
            text-decoration: none;
        }

        .footer .discord-link:hover {
            background: #4752c4;
            transform: scale(1.05);
        }

    
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 15px;
                border-right: none;
                border-bottom: 2px solid #2a2a2a;
            }

            .sidebar .logo-side img {
                max-width: 70px;
                margin-bottom: 0;
                margin-right: 20px;
            }

            .sidebar nav {
                flex-direction: row;
                width: auto;
                gap: 5px;
            }

            .sidebar nav a {
                padding: 8px 16px;
                font-size: 14px;
            }

            .lang-toggle {
                margin-top: 0;
                margin-left: 10px;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .banner-grid,
            .projetos-grid {
                grid-template-columns: 1fr 1fr;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .banner-grid,
            .projetos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>


    <aside class="sidebar">
        <div class="logo-side">

            <img src="logo.png" alt="Logo">
        </div>
        <nav>
            <a class="ativo" data-page="home" data-i18n="nav_home">🏠 Inicio</a>
            <a data-page="projetos" data-i18n="nav_projetos">📁 Projetos</a>
        </nav>

        <div class="lang-toggle">
            <button id="langPt" class="ativo-idioma">🇧🇷 PT</button>
            <button id="langEn">🇺🇸 EN</button>
        </div>
    </aside>

  
    <main class="main-content">

  
        <section id="home" class="page ativa">
            <div class="logo-principal">
                <img src="logo.png" alt="Logo">
            </div>

            <div class="search-area">
                <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="🔍 Pesquisar addons...">
            </div>


            <div id="bannerContainer" class="banner-grid">
         
            </div>
        </section>


        <section id="projetos" class="page">
            <div class="header-projetos">
                <h1 data-i18n="projects_title">✨ Meus Addons</h1>
                <p data-i18n="projects_subtitle">Addons exclusivos para Minecraft Bedrock</p>
            </div>

            <div id="projetosContainer" class="projetos-grid">
             
            </div>
        </section>

  
        <footer class="footer">
            <div class="contatos">
                <span>📧 <a href="mailto:seuemail@email.com" data-i18n="footer_email">seuemail@email.com</a></span>
                <span>📱 <a href="#" data-i18n="footer_phone">(11) 99999-9999</a></span>
                <span>🐦 <a href="#" data-i18n="footer_social">@seudiscord</a></span>
            </div>
            <div>
                <a href="#" class="discord-link" data-i18n="footer_discord">💬 Entre no meu Discord</a>
            </div>
        </footer>

    </main>

    <script>

        const projetosData = [{
            id: 1,
            imagem: "img/addon1.jpg",
            // Versão Português
            titulo_pt: "Addon: Novas Armas e Ferramentas",
            desc_pt: "Adiciona 10 novas armas (espadas, machados e arcos) e ferramentas exclusivas com encantamentos únicos para o Bedrock.",
            cat_pt: "Addon de Itens",
            // Versão Inglês
            titulo_en: "Addon: New Weapons & Tools",
            desc_en: "Adds 10 new weapons (swords, axes, bows) and exclusive tools with unique enchantments for Bedrock.",
            cat_en: "Items Addon"
        }, {
            id: 2,
            imagem: "img/addon2.jpg",
            titulo_pt: "Addon: Criaturas Místicas",
            desc_pt: "Introduz dragões, grifos e outras 8 criaturas lendárias totalmente domesticáveis ao seu mundo Minecraft.",
            cat_pt: "Addon de Criaturas",
            titulo_en: "Addon: Mythic Creatures",
            desc_en: "Introduces dragons, griffins, and 8 other fully tameable legendary creatures to your Minecraft world.",
            cat_en: "Creatures Addon"
        }];


        const translations = {
            pt: {
                nav_home: "🏠 Inicio",
                nav_projetos: "📁 Projetos",
                search_placeholder: "🔍 Pesquisar addons por nome ou descrição...",
                projects_title: "✨ Meus Addons",
                projects_subtitle: "Addons exclusivos para Minecraft Bedrock",
                no_results: "Nenhum addon encontrado.",
                footer_email: "seuemail@email.com",
                footer_phone: "(11) 99999-9999",
                footer_social: "@seudiscord",
                footer_discord: "💬 Entre no meu Discord",
                badge: "⭐ Parceiro"
            },
            en: {
                nav_home: "🏠 Home",
                nav_projetos: "📁 Projects",
                search_placeholder: "🔍 Search addons by name or description...",
                projects_title: "✨ My Addons",
                projects_subtitle: "Exclusive addons for Minecraft Bedrock",
                no_results: "No addons found.",
                footer_email: "myemail@email.com",
                footer_phone: "(11) 99999-9999",
                footer_social: "@myDiscord",
                footer_discord: "💬 Join my Discord",
                badge: "⭐ Partner"
            }
        };

        let currentLang = 'pt'; 

        

        function getLocalizedProject(proj, lang) {
            return {
                ...proj,
                titulo: lang === 'pt' ? proj.titulo_pt : proj.titulo_en,
                desc: lang === 'pt' ? proj.desc_pt : proj.desc_en,
                categoria: lang === 'pt' ? proj.cat_pt : proj.cat_en
            };
        }

        function renderBanners(lang, filterText = '') {
            const container = document.getElementById('bannerContainer');
            container.innerHTML = '';

            let lista = projetosData.map(p => getLocalizedProject(p, lang));

            if (filterText.trim() !== '') {
                const termo = filterText.toLowerCase().trim();
                lista = lista.filter(p =>
                    p.titulo.toLowerCase().includes(termo) ||
                    p.desc.toLowerCase().includes(termo) ||
                    p.categoria.toLowerCase().includes(termo)
                );
            }

            if (lista.length === 0) {
                const noResultMsg = translations[lang].no_results;
                container.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#666; font-size:18px; padding:40px;">${noResultMsg}</p>`;
                return;
            }

            lista.forEach(proj => {
                const div = document.createElement('div');
                div.className = 'banner-item';
                div.innerHTML = `
                    <img src="${proj.imagem}" alt="${proj.titulo}" loading="lazy">
                    <div class="info">
                        <h3>${proj.titulo}</h3>
                        <p>${proj.desc}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderProjetos(lang) {
            const container = document.getElementById('projetosContainer');
            container.innerHTML = '';

            const lista = projetosData.map(p => getLocalizedProject(p, lang));
            const badgeText = translations[lang].badge;

            lista.forEach(proj => {
                const div = document.createElement('div');
                div.className = 'card-projeto';
                div.innerHTML = `
                    <span class="badge">${badgeText}</span>
                    <img src="${proj.imagem}" alt="${proj.titulo}" loading="lazy">
                    <div class="conteudo">
                        <h3>${proj.titulo}</h3>
                        <div class="subtitulo">${proj.categoria}</div>
                        <p>${proj.desc}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }


        function applyLanguage(lang) {
            currentLang = lang;


            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // Atualiza placeholders com data-i18n-placeholder
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });


            const searchInput = document.getElementById('searchInput');
            renderBanners(lang, searchInput.value);
            renderProjetos(lang);

    
            document.getElementById('langPt').classList.toggle('ativo-idioma', lang === 'pt');
            document.getElementById('langEn').classList.toggle('ativo-idioma', lang === 'en');


            document.documentElement.lang = lang;
        }

        const links = document.querySelectorAll('.sidebar nav a');
        const pages = {
            home: document.getElementById('home'),
            projetos: document.getElementById('projetos')
        };

        links.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                links.forEach(l => l.classList.remove('ativo'));
                this.classList.add('ativo');

                Object.values(pages).forEach(p => p.classList.remove('ativa'));

                const pageId = this.getAttribute('data-page');
                pages[pageId].classList.add('ativa');
            });
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            renderBanners(currentLang, this.value);
        });

        document.getElementById('langPt').addEventListener('click', () => applyLanguage('pt'));
        document.getElementById('langEn').addEventListener('click', () => applyLanguage('en'));

        applyLanguage('pt');
    </script>

</body>
</html>
